<button
  type="button"
  class="chatbot-fab"
  (click)="openChat()"
  aria-label="Abrir asistente virtual del Polo"
  title="Asistente virtual del Polo"
>
  <svg class="chatbot-fab-icon" viewBox="0 0 100 100" aria-hidden="true">
    <defs>
      <radialGradient id="botHeadShine" cx="35%" cy="30%" r="75%">
        <stop offset="0%" stop-color="#ffffff" />
        <stop offset="100%" stop-color="#dfe3ea" />
      </radialGradient>
      <radialGradient id="botEyeGlow" cx="50%" cy="45%" r="60%">
        <stop offset="0%" stop-color="#8ff4e8" />
        <stop offset="100%" stop-color="#12b3a8" />
      </radialGradient>
    </defs>
    <circle cx="50" cy="50" r="46" fill="url(#botHeadShine)" />
    <rect x="24" y="34" width="52" height="34" rx="17" fill="#12141c" />
    <ellipse cx="39" cy="51" rx="5.5" ry="9" fill="url(#botEyeGlow)" />
    <ellipse cx="61" cy="51" rx="5.5" ry="9" fill="url(#botEyeGlow)" />
  </svg>
</button>

@if (open) {
  <div class="chatbot-overlay">
    <button
      type="button"
      class="chatbot-overlay-close"
      (click)="closeChat()"
      aria-label="Cerrar el asistente virtual"
      title="Cerrar"
    >
      <span class="material-symbols-outlined">close</span>
    </button>
    <app-chat></app-chat>
  </div>
}
